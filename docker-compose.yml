# Optional local Postgres — skip this entirely if you're using a hosted
# DB (Supabase, Neon, RDS, etc.) and just point DATABASE_URL at that
# instead. pgvector extension is baked into the image below.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
