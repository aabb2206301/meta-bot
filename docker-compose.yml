# =============================================================================
# Local dev stack — backend + frontend only.
# Database is cloud-hosted (Postgres + pgvector) — no local postgres service.
# Set DATABASE_URL / ALEMBIC_DATABASE_URL in backend/.env to point at your
# cloud DB (see backend/.env.example for the full variable list).
#
# `docker compose up -d --build` brings up backend + frontend locally,
# both talking to your cloud database.
# =============================================================================

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
    env_file:
      - ./backend/.env   # DATABASE_URL / ALEMBIC_DATABASE_URL point at cloud DB here
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app  # live-reload code in dev

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Vite reads VITE_* at build time. The frontend's API client hits
      # /api (proxied to the backend via vite.config.ts) so this is only
      # needed if you want absolute URLs somewhere.
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src  # live-reload code in dev